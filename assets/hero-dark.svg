<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 206" width="840" height="206" fill="none">
  <defs>
    <pattern id="grid-dark" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#C5F82A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="ambient-dark" cx="78%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#C5F82A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#14171D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5F82A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C5F82A" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.28; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes sweepLine {
        0% { transform: translateX(-180px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateX(770px); opacity: 0; }
      }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.1s step-end infinite; }
      .sweep { animation: sweepLine 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <rect width="840" height="206" rx="6" fill="#14171D"/>
  <rect width="840" height="206" rx="6" fill="url(#ambient-dark)"/>
  <rect width="840" height="206" rx="6" fill="url(#grid-dark)"/>
  <rect x="0.5" y="0.5" width="839" height="205" rx="5.5" stroke="#ECEDF0" stroke-opacity="0.14"/>

  <!-- Editorial registration corner ticks -->
  <path d="M16 24 V16 H24 M816 16 H824 V24 M16 182 V190 H24 M816 190 H824 V182" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Top metadata bar -->
  <text x="36" y="38" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.4" fill="#949AA5">
    00 / MAYANK SAHU — IIIT NAYA RAIPUR
  </text>
  <circle cx="678" cy="34" r="3" fill="#C5F82A" class="pulse"/>
  <text x="804" y="38" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="1.2" fill="#C5F82A">
    MAYANKSAHU.DEV
  </text>
  <line x1="36" y1="52" x2="804" y2="52" stroke="#ECEDF0" stroke-opacity="0.12"/>
  <rect x="36" y="51.2" width="140" height="1.6" fill="url(#sweep-dark)" class="sweep"/>

  <!-- Editorial Serif Headline -->
  <text x="36" y="99" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" letter-spacing="-0.4" fill="#ECEDF0">
    High-trust systems built to survive
  </text>
  <text x="36" y="138" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" font-style="italic" letter-spacing="-0.4" fill="#C5F82A">
    an unpredictable machine age.
  </text>

  <!-- Right-side subtle index mark + palette spectrum -->
  <text x="804" y="98" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#949AA5" fill-opacity="0.75">
    EDITION 2026
  </text>
  <text x="804" y="115" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#38BDF8" fill-opacity="0.8">
    RAIPUR · IN
  </text>
  <rect x="760" y="126" width="12" height="3" rx="1.5" fill="#C5F82A"/>
  <rect x="776" y="126" width="12" height="3" rx="1.5" fill="#38BDF8"/>
  <rect x="792" y="126" width="12" height="3" rx="1.5" fill="#FB923C"/>

  <!-- Bottom footer rule -->
  <line x1="36" y1="160" x2="804" y2="160" stroke="#ECEDF0" stroke-opacity="0.12"/>
  <text x="36" y="182" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#949AA5">
    PROCESS ORCHESTRATION · LOCAL WASM · DISTRIBUTED BACKENDS · APPLIED RESEARCH
  </text>
  <text x="795" y="182" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#ECEDF0">
    @MSNOTFOUND
  </text>
  <rect x="798" y="172.5" width="6" height="11" fill="#38BDF8" class="cursor"/>
</svg>
