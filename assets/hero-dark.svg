      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <pattern id="grid-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E242D" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="840" height="210" rx="12" fill="url(#bg-dark)"/>
