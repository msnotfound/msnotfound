      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E5E7EB" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="840" height="210" rx="12" fill="url(#bg-light)"/>
