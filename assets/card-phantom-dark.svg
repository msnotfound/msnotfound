<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 210" width="410" height="210" fill="none">
  <defs>
    <linearGradient id="phantom-fill-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5F82A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C5F82A" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes ping {
        0%, 100% { r: 4; opacity: 1; }
        50% { r: 7.5; opacity: 0.25; }
      }
      .ping { animation: ping 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="410" height="210" rx="6" fill="#14171D"/>
  <rect x="0.5" y="0.5" width="409" height="209" rx="5.5" stroke="#ECEDF0" stroke-opacity="0.14"/>

  <text x="20" y="26" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing="1.2" fill="#38BDF8">
    02 / APPLIED RESEARCH · PHANTOM
  </text>
  <text x="20" y="50" font-family="'EB Garamond', Georgia, serif" font-size="20" fill="#ECEDF0">
    Cost-Amortized Agent Replay
  </text>

  <!-- Chart axes -->
  <line x1="34" y1="74" x2="34" y2="152" stroke="#ECEDF0" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="34" y1="152" x2="386" y2="152" stroke="#ECEDF0" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Baseline VLM linear cost (Warm Coral) -->
  <line x1="34" y1="148" x2="376" y2="74" stroke="#FB923C" stroke-opacity="0.75" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="376" y="70" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" fill="#FB923C">VLM per-step O(N)</text>

  <!-- Shaded area under Phantom curve -->
  <polygon points="34,148 92,138 376,138 376,152 34,152" fill="url(#phantom-fill-dark)"/>

  <!-- Phantom flat $0 replay line -->
  <polyline points="34,148 92,138 376,138" stroke="#C5F82A" stroke-width="2" fill="none"/>
  <text x="376" y="131" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#C5F82A">Phantom $0/replay</text>

  <!-- Break-even N* = 1 -->
  <line x1="92" y1="138" x2="92" y2="152" stroke="#C5F82A" stroke-opacity="0.5" stroke-dasharray="2 2"/>
  <circle cx="92" cy="138" r="4" fill="#C5F82A" fill-opacity="0.35" class="ping"/>
  <circle cx="92" cy="138" r="3.5" fill="#C5F82A"/>
  <text x="92" y="165" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" fill="#C5F82A">N* = 1</text>

  <line x1="20" y1="178" x2="390" y2="178" stroke="#ECEDF0" stroke-opacity="0.1"/>
  <text x="20" y="196" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#949AA5">
    AT-SPI · all-MiniLM-L6-v2 · 6 GTK workflows
  </text>
</svg>
