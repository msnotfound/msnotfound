    </style>
  </defs>

  <rect width="840" height="168" rx="6" fill="#14171D"/>
  <rect x="0.5" y="0.5" width="839" height="167" rx="5.5" stroke="#ECEDF0" stroke-opacity="0.14"/>

  <!-- Header -->
  <text x="24" y="25" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.2" fill="#949AA5">
    01 / SYSTEM TOPOLOGY &amp; MEASURED INVARIANTS
  </text>
  <line x1="24" y1="36" x2="816" y2="36" stroke="#ECEDF0" stroke-opacity="0.1"/>

  <!-- Row 1: Fleetorch -->
  <text x="24" y="65" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#C5F82A">FLEETORCH</text>
  <rect x="128" y="49" width="140" height="24" rx="4" fill="#1C2028" stroke="#ECEDF0" stroke-opacity="0.16"/>
